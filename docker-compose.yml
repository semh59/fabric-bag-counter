# Server/cloud stack: API, job queue, ERP dispatch, and the database they
# share. No camera or GPU hardware is needed by anything here.
#
# The camera-reading/model-inference side (supervisor + per-camera ingest +
# inference) runs separately, on the actual factory-floor machine that has
# the cameras/GPU attached -- see docker-compose.edge.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: cs-postgres
    restart: always
    environment:
      POSTGRES_DB: cuval_sayim_db
      POSTGRES_USER: cuval_admin
      POSTGRES_PASSWORD: cuval_secure_2026
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuval_admin -d cuval_sayim_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # One-shot: brings the schema up to the latest Alembic revision before any
  # real service starts, then exits. Previously nothing ever ran migrations
  # -- every service bootstrapped via init_db_sync()'s create_all(), which
  # only creates missing tables and never alters existing ones, so an ORM
  # column added after first deploy would silently never reach a real
  # database (this happened for real this session: a 500 error from a
  # missing column, fixed with a manual ALTER TABLE against the running
  # container). api/jobrunner/erp-relay now wait for this to finish
  # successfully instead of racing each other to migrate concurrently.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: cs-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_SYNC_URL: postgresql://cuval_admin:cuval_secure_2026@postgres:5432/cuval_sayim_db
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: cs-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://cuval_admin:cuval_secure_2026@postgres:5432/cuval_sayim_db
      DATABASE_SYNC_URL: postgresql://cuval_admin:cuval_secure_2026@postgres:5432/cuval_sayim_db
      NODE_ID: 1
      LOG_LEVEL: INFO
      # Without this, services/api/auth.py generates a fresh random secret
      # on every container start -- every previously issued JWT (every
      # logged-in browser session) is silently invalidated on every
      # restart/rebuild. Set in a real .env file (see .env.example),
      # Compose substitutes it in automatically; empty if unset there.
      SECRET_KEY: ${SECRET_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  jobrunner:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: cs-jobrunner
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://cuval_admin:cuval_secure_2026@postgres:5432/cuval_sayim_db
      DATABASE_SYNC_URL: postgresql://cuval_admin:cuval_secure_2026@postgres:5432/cuval_sayim_db
      NODE_ID: 1
      LOG_LEVEL: INFO
    command: ["python", "-m", "services.jobrunner.worker"]
    volumes:
      - ./data:/app/data

  erp-relay:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: cs-erp-relay
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://cuval_admin:cuval_secure_2026@postgres:5432/cuval_sayim_db
      DATABASE_SYNC_URL: postgresql://cuval_admin:cuval_secure_2026@postgres:5432/cuval_sayim_db
      NODE_ID: 1
      LOG_LEVEL: INFO
    command: ["python", "-m", "services.erp_relay.worker"]
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:

