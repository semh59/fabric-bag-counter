# Server/cloud stack: API, job queue, ERP dispatch, and the database they
# share. No camera or GPU hardware is needed by anything here.
#
# The camera-reading/model-inference side (supervisor + per-camera ingest +
# inference) runs separately, on the actual factory-floor machine that has
# the cameras/GPU attached -- see docker-compose.edge.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: cs-postgres
    restart: always
    environment:
      POSTGRES_DB: bag_counter_db
      POSTGRES_USER: bag_admin
      POSTGRES_PASSWORD: bag_secure_2026
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bag_admin -d bag_counter_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # One-shot: brings the schema up to the latest Alembic revision before any
  # real service starts, then exits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: cs-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_SYNC_URL: postgresql://bag_admin:bag_secure_2026@postgres:5432/bag_counter_db
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: cs-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://bag_admin:bag_secure_2026@postgres:5432/bag_counter_db
      DATABASE_SYNC_URL: postgresql://bag_admin:bag_secure_2026@postgres:5432/bag_counter_db
      NODE_ID: 1
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  jobrunner:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: cs-jobrunner
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://bag_admin:bag_secure_2026@postgres:5432/bag_counter_db
      DATABASE_SYNC_URL: postgresql://bag_admin:bag_secure_2026@postgres:5432/bag_counter_db
      NODE_ID: 1
      LOG_LEVEL: INFO
    command: ["python", "-m", "services.jobrunner.worker"]
    volumes:
      - ./data:/app/data

  erp-relay:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: cs-erp-relay
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://bag_admin:bag_secure_2026@postgres:5432/bag_counter_db
      DATABASE_SYNC_URL: postgresql://bag_admin:bag_secure_2026@postgres:5432/bag_counter_db
      NODE_ID: 1
      LOG_LEVEL: INFO
    command: ["python", "-m", "services.erp_relay.worker"]
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:

