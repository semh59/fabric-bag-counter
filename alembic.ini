# Alembic configuration
[alembic]
script_location = packages/cs_storage/migrations
prepend_sys_path = .
version_path_separator = os
# Placeholder only -- migrations/env.py overrides this with the real
# DATABASE_SYNC_URL/default resolution (matching packages/cs_storage/db.py),
# unless a caller has already set an explicit sqlalchemy.url (e.g. tests
# pointing at a throwaway database), in which case that is left alone.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/cuval_sayim

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
