[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuval-sayim"
version = "2.0.0"
description = "Yerel Konveyör Çuval Sayım Sistemi"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cuval Sayim Core Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "filterpy>=1.4.5",
    "pillow>=10.2.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "opencv-python-headless>=4.9.0.80",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Plain CPU onnxruntime for VisionDetector inside cs-api itself
# (services/api/routes.py's live MJPEG stream runs detection in-process via
# stream_renderer.LiveStreamRenderer -- not just the edge/training stack).
# Kept as its own extra rather than a base dependency, and deliberately NOT
# onnxruntime-gpu: the server-stack machine (Dockerfile.core) has no GPU,
# and installing both onnxruntime and onnxruntime-gpu together in one
# environment is a real conflict -- both packages ship the same top-level
# `onnxruntime` module, so combining this extra with `vision` below (which
# installs onnxruntime-gpu, used on the edge/GPU machine) would corrupt
# whichever installs second. Each Dockerfile installs exactly one of the two.
api-inference = [
    "onnxruntime>=1.17.0",
]
vision = [
    "onnxruntime-gpu==1.17.1",
    "opencv-python-headless>=4.9.0.80",
    "supervision==0.19.0",
    "av==11.0.0",
    "albumentations>=1.4.0",
    "pycocotools>=2.0.7",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "pip-licenses>=4.3.0",
]

[project.scripts]
cs-supervisor = "services.supervisor.manager:main"
cs-ingest = "services.ingest.worker:main"
cs-inference = "services.inference.worker:main"
cs-api = "services.api.main:main"
cs-jobrunner = "services.jobrunner.worker:main"
cs-erp-relay = "services.erp_relay.worker:main"
cs-replay = "tools.replay:main"
cs-benchmark = "tools.benchmark:main"
cs-license-check = "tools.license_check:main"
cs-hardcode-check = "tools.hardcode_check:main"

[project.entry-points."cs.video_source"]
rtsp = "drivers.video_rtsp.driver:RtspVideoSource"
file = "drivers.video_file.driver:FileVideoSource"

[project.entry-points."cs.erp_adapter"]
csv = "drivers.erp_csv.adapter:CsvErpAdapter"
sap_odata = "drivers.erp_sap_odata.adapter:SapODataErpAdapter"

[project.entry-points."cs.io_controller"]
noop = "drivers.io_noop.controller:NoopIoController"
usb_relay = "drivers.io_usb_relay.controller:UsbRelayIoController"

[project.entry-points."cs.session_identity"]
operator = "drivers.identity_operator.identity:OperatorSessionIdentity"
erp = "drivers.identity_erp.identity:ErpSessionIdentity"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*", "drivers*", "tools*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "packages.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-p no:asyncio"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
