apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fabric-bag-counter.fullname" . }}-api
  labels:
    {{- include "fabric-bag-counter.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fabric-bag-counter.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "fabric-bag-counter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.httpPort }}
              protocol: TCP
            - name: webrtc
              containerPort: {{ .Values.api.service.webrtcPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "fabric-bag-counter.fullname" . }}-config
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: DATABASE_SYNC_URL
              value: "postgresql://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretName }}
                  key: {{ .Values.database.passwordSecretKey }}
                  optional: true
            - name: DB_SSL_CA
              value: "/etc/ssl/certs/ca.crt"
            - name: DB_SSL_CERT
              value: "/etc/ssl/certs/edge_client.crt"
            - name: DB_SSL_KEY
              value: "/etc/ssl/certs/edge_client.key"
          volumeMounts:
            - name: mtls-certs
              mountPath: /etc/ssl/certs
              readOnly: true
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: mtls-certs
          secret:
            secretName: {{ .Values.database.ssl.caSecretName }}
            optional: true
