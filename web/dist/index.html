<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabric Bag Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tailwind.css">
  <style>
    :root {
      --bg-main: #15171a;
      --card-bg: rgba(36, 40, 46, 0.92);
      --border-color: rgba(54, 59, 65, 0.85);
      --primary: #5b9bd1;
      --primary-hover: #7cb8e8;
      --accent-green: #46955f;
    }
    * { box-sizing: border-box; }
    body { background-color: var(--bg-main); color: #edf0f2; font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    h1, h2, h3 { font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; letter-spacing: 0.005em; }
    .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.65rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.025em; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; padding: 0.85rem 1.4rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.6); animation: slideIn 0.25s ease-out; }
    @keyframes slideIn { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes countPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); color: #59b378; } 100% { transform: scale(1); } }
    .count-pulse { animation: countPulse 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    .spinner { border: 3px solid rgba(91, 155, 209, 0.2); border-top-color: #5b9bd1; border-radius: 50%; width: 1.5rem; height: 1.5rem; animation: spin 0.6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    input, select, textarea { background-color: #1e2227; border: 1px solid #363b41; color: #edf0f2; border-radius: 0.5rem; padding: 0.55rem 0.85rem; font-size: 0.875rem; transition: all 0.15s ease; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #5b9bd1; box-shadow: 0 0 0 2px rgba(91, 155, 209, 0.35); }

    /* Alarm bar: persistent (ISA-18.2 style) */
    .alarm-bar { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; border-radius: 0.6rem; margin-bottom: 1rem; border: 1px solid #363b41; background: #1a1d22; }
    .alarm-bar.has-alarms { background: rgba(217, 155, 62, 0.12); border-color: #d99b3e; }
    .alarm-bar .list { display: flex; gap: 1.1rem; flex-wrap: wrap; font-size: 0.75rem; color: #edf0f2; flex: 1; }
    .alarm-bar.clean .list { color: #868d94; }
    .alarm-bar .list b { font-family: "IBM Plex Mono", monospace; }

    /* Damage/defect log */
    .defect-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; font-size: 0.8rem; border-bottom: 1px solid #292d33; }
    .defect-row:last-child { border-bottom: none; }
    .defect-row .t { font-family: "IBM Plex Mono", monospace; color: #868d94; font-size: 0.7rem; width: 3.6rem; flex-shrink: 0; }
    .defect-row .desc { flex: 1; color: #cdd1d5; }
    .defect-row .who { color: #868d94; }

    /* Left rail navigation (desktop) */
    #nav-menu-rail { display: flex; flex-direction: column; gap: 0.2rem; }
    #nav-menu-rail button { width: 100%; text-align: left; white-space: normal; }

    /* Camera wall */
    .cam-wall { display: flex; gap: 0.875rem; align-items: flex-start; }
    .cam-wall.grid-mode { display: grid; gap: 0.875rem; }
    .cam-hero { flex: 1; min-width: 0; }
    .cam-wall.grid-mode .cam-hero { display: none; }
    .cam-thumbs-wrap { position: relative; width: 200px; flex-shrink: 0; }
    .cam-wall.grid-mode .cam-thumbs-wrap { display: contents; }
    .cam-thumbs { display: flex; flex-direction: column; gap: 0.5rem; max-height: 420px; overflow-y: auto; padding-right: 2px; }
    .cam-wall.grid-mode .cam-thumbs { display: contents; }
    .cam-thumb { background: #1a1d22; border: 1px solid #363b41; border-radius: 0.6rem; overflow: hidden; cursor: pointer; transition: border-color .12s; flex-shrink: 0; }
    .cam-thumb:hover { border-color: #5b9bd1; }
    .cam-thumb.attn { border-color: #d99b3e; }
    .cam-thumb img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #101215; }
    .cam-wall.grid-mode .cam-thumb img { aspect-ratio: 16/10; }
    .cam-thumb .th-label { padding: 0.35rem 0.5rem; font-size: 0.7rem; font-weight: 600; display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cam-thumbs-more { position: absolute; left: 0; right: 2px; bottom: 0; text-align: center; font-size: 0.65rem; font-weight: 600; color: #15171a; background: linear-gradient(0deg, #5b9bd1 0%, #5b9bd1 65%, transparent 100%); padding: 0.9rem 0 0.3rem; border-radius: 0 0 0.6rem 0.6rem; pointer-events: none; }
    .primary-cam-badge { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.04em; background: rgba(91,155,209,0.16); color: #7cb8e8; padding: 0.1rem 0.4rem; border-radius: 0.2rem; white-space: nowrap; }
    .aux-cam-badge { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.02em; color: #868d94; border: 1px solid #363b41; padding: 0.1rem 0.4rem; border-radius: 0.2rem; white-space: nowrap; }
    .digital-font { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 1.25rem; }
    .glass-card:hover { border-color: rgba(91, 155, 209, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ===================== MAIN APP SHELL ===================== -->
  <div id="app-shell" class="flex-1 flex min-h-screen">
    <!-- Left Rail (desktop, lg and up): control-room style vertical navigation -->
    <aside class="hidden lg:flex lg:flex-col w-60 flex-shrink-0 bg-slate-900 border-r border-slate-800 h-screen sticky top-0 overflow-y-auto">
      <div class="flex items-center space-x-2.5 cursor-pointer px-4 py-4 border-b border-slate-800" onclick="setTab('live')">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white text-sm shadow-md shadow-indigo-500/20 flex-shrink-0">BC</div>
        <div class="min-w-0">
          <div class="text-base font-extrabold tracking-tight text-white leading-tight">Bag Counter</div>
          <div class="text-[10px] text-slate-400 font-mono truncate" id="current-line-label-rail">Facility not configured</div>
        </div>
      </div>

      <nav id="nav-menu-rail" class="flex-1 px-3 py-3 text-xs font-semibold"></nav>

      <div class="border-t border-slate-800 p-3 space-y-2">
        <div class="flex items-center justify-between gap-2">
          <button onclick="toggleAudio()" id="audio-toggle-btn-rail" class="flex-1 p-2 bg-slate-800/80 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 text-xs flex items-center justify-center space-x-1.5 transition" title="Toggle counting sound effect">
            <span id="audio-icon-rail">🔊</span>
            <span class="text-[11px]" id="audio-label-rail">Sound On</span>
          </button>
        </div>
        <div class="flex items-center space-x-2 bg-slate-800/60 px-3 py-1.5 rounded-lg border border-slate-700/50">
          <span id="health-dot-rail" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs text-slate-300 font-medium" id="live-indicator-rail">System Online</span>
        </div>
        <div id="user-box-rail" class="flex flex-col space-y-2"></div>
      </div>
    </aside>

    <!-- Main column: mobile top bar + page content -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">
      <!-- Top Navigation Header (mobile / below-lg only) -->
      <header class="lg:hidden bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 sticky top-0 z-40 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-2.5 cursor-pointer min-w-0" onclick="setTab('live')">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white text-sm shadow-md shadow-indigo-500/20 flex-shrink-0">BC</div>
          <div class="min-w-0">
            <div class="text-base font-extrabold tracking-tight text-white leading-tight">Bag Counter</div>
            <div class="text-[10px] text-slate-400 font-mono truncate" id="current-line-label">Facility not configured</div>
          </div>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center space-x-2 flex-shrink-0">
          <button onclick="toggleAudio()" id="audio-toggle-btn" class="p-2 bg-slate-800/80 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 text-xs flex items-center space-x-1.5 transition" title="Toggle counting sound effect">
            <span id="audio-icon">🔊</span>
            <span class="hidden sm:inline text-[11px]" id="audio-label">Sound On</span>
          </button>

          <div class="flex items-center space-x-2 bg-slate-800/60 px-3 py-1.5 rounded-lg border border-slate-700/50">
            <span id="health-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs text-slate-300 font-medium hidden sm:inline" id="live-indicator">System Online</span>
          </div>

          <!-- Authenticated User Box -->
          <div id="user-box" class="border-l border-slate-700 pl-2 flex items-center space-x-2"></div>
        </div>
      </header>

      <!-- Mobile Navigation Bar -->
      <div class="lg:hidden bg-slate-900 border-b border-slate-800 px-4 py-2 overflow-x-auto flex space-x-2 text-xs" id="mobile-nav-menu"></div>

      <!-- Main Dynamic Screen Viewport -->
      <main id="app-container" class="flex-1 p-4 md:p-6 max-w-7xl w-full mx-auto"></main>
    </div>
  </div>

  <!-- Event Ledger Detail Modal -->
  <div id="ledger-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass-card max-w-3xl w-full p-6 shadow-2xl border border-slate-700 flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center pb-4 border-b border-slate-800">
        <div>
          <h3 class="text-lg font-bold text-white flex items-center space-x-2">
            <span>📜 Count Event Ledger</span>
            <span class="text-xs text-indigo-400 font-mono" id="ledger-modal-sess-title"></span>
          </h3>
          <p class="text-xs text-slate-400">Single source of truth: Append-only immutable event records (§5.5).</p>
        </div>
        <button onclick="document.getElementById('ledger-modal').classList.add('hidden')" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>
      <div class="flex-1 overflow-y-auto my-4 pr-1" id="ledger-modal-body">
        <div class="text-center py-10"><div class="spinner"></div></div>
      </div>
      <div class="pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
        <span id="ledger-modal-count-summary">Total: 0 Events</span>
        <button onclick="document.getElementById('ledger-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-medium">Close</button>
      </div>
    </div>
  </div>

  <!-- Product / Bag Profile Customizer Modal -->
  <div id="bag-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass-card max-w-xl w-full p-6 shadow-2xl border border-slate-700">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
        <h3 class="text-base font-bold text-white flex items-center space-x-2">
          <span>📦 Define New Bag / Product Profile (§5.2)</span>
        </h3>
        <button onclick="document.getElementById('bag-modal').classList.add('hidden')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="space-y-3.5 text-xs">
        <div>
          <label class="text-slate-400 font-semibold block mb-1">Product / Bag Name</label>
          <input type="text" id="modal-bag-name" placeholder="e.g. 50kg Portland Cement Bag" class="w-full">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">ERP Material Code</label>
            <input type="text" id="modal-bag-erp" placeholder="MAT-CEM-50" class="w-full font-mono">
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Nominal Weight (kg)</label>
            <input type="number" id="modal-bag-weight" value="50" class="w-full">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Width (W mm)</label>
            <input type="number" id="modal-bag-w" value="480" class="w-full">
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Length (L mm)</label>
            <input type="number" id="modal-bag-l" value="650" class="w-full">
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Thickness (H mm)</label>
            <input type="number" id="modal-bag-h" value="130" class="w-full">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Bag Color / Material</label>
            <select id="modal-bag-color" class="w-full">
              <option value="kraft_yellow">Yellow Kraft Bag</option>
              <option value="poly_white">White Polyethylene / Woven</option>
              <option value="mortar_gray">Gray Dry Mortar Bag</option>
              <option value="red_special">Red Special Mix</option>
            </select>
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Area Tolerance (±%)</label>
            <input type="number" id="modal-bag-tol" value="6.0" class="w-full">
          </div>
        </div>
      </div>
      <div class="mt-6 pt-4 border-t border-slate-800 flex justify-end space-x-2">
        <button onclick="document.getElementById('bag-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl">Cancel</button>
        <button onclick="saveNewBagProfile()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-md">Save & Activate</button>
      </div>
    </div>
  </div>

  <!-- Hidden Video File Input -->
  <input type="file" id="video-file-input" accept="video/mp4,video/avi,video/mkv,video/mov" class="hidden">

  <script>
    const API = '/api';
    let auth = { token: null, username: null, role: null };
    let activeTab = 'live';
    let sseSource = null;
    let selectedLineId = null;
    let auxCamHeroId = null;
    let auxCamGridMode = false;
    let currentOtherCameras = [];

    // Live Feed Mode: 'stream' (Real OpenCV MJPEG) or 'canvas' (60 FPS Simulator)
    let feedMode = 'stream';

    // Conveyor & Belt Settings State
    let beltSpeedFactor = 2.5;
    let opticalGateX = 480;
    let beltDirection = 1;
    let activeBagColor = 'kraft_yellow';
    let activeBagLabel = '50kg Cement';

    // Simulation animation state (for canvas mode)
    let isAutoSimRunning = true;
    let canvasAnimationId = null;
    let bagsOnBelt = [];
    let nextTrackId = 1050;

    function toggleAudio() {
      toggleAudioFeedback();
    }

    // ===================== HTTP & API HELPERS =====================
    function headers(hasBody = false) {
      const h = {};
      if (auth.token) h['Authorization'] = 'Bearer ' + auth.token;
      if (hasBody) h['Content-Type'] = 'application/json';
      return h;
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, { headers: headers(!!opts.body), ...opts });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      if (!res.ok) throw { status: res.status, detail: (data && data.detail) ? data.detail : text };
      return data;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white border border-emerald-400/40',
        error: 'bg-rose-600 text-white border border-rose-400/40',
        warn: 'bg-amber-600 text-white border border-amber-400/40',
        info: 'bg-indigo-600 text-white border border-indigo-400/40',
      };
      el.className = `toast ${colors[type] || colors.success}`;
      el.innerHTML = `<span>${type === 'error' ? '⚠️' : type === 'warn' ? '🔔' : type === 'info' ? 'ℹ️' : '✅'}</span> <span class="ml-1.5">${escapeHtml(msg)}</span>`;
      document.body.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(1rem)';
        el.style.transition = 'all 0.3s ease-out';
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    // ===================== AUTH & LOGIN =====================
    function renderUserBox() {
      const roleLabels = { operator: '👷 Operator', engineer: '👨‍🔬 Engineer', admin: '👑 Admin' };

      const el = document.getElementById('user-box');
      if (el) {
        el.innerHTML = auth.token ? `
          <div class="hidden md:flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-xs">
            <span class="font-bold text-slate-200">${escapeHtml(auth.username)}</span>
            <span class="badge bg-indigo-500/20 text-indigo-300 text-[10px]">${escapeHtml(roleLabels[auth.role] || auth.role)}</span>
          </div>
          <button onclick="logout()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-rose-900/40 text-xs font-semibold rounded-lg border border-slate-700 text-slate-300 hover:text-rose-300 transition">
            Logout
          </button>
        ` : '';
      }

      const railEl = document.getElementById('user-box-rail');
      if (railEl) {
        railEl.innerHTML = auth.token ? `
          <div class="flex items-center justify-between bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-xs">
            <span class="font-bold text-slate-200 truncate">${escapeHtml(auth.username)}</span>
            <span class="badge bg-indigo-500/20 text-indigo-300 text-[10px] flex-shrink-0">${escapeHtml(roleLabels[auth.role] || auth.role)}</span>
          </div>
          <button onclick="logout()" class="w-full px-2.5 py-1.5 bg-slate-800 hover:bg-rose-900/40 text-xs font-semibold rounded-lg border border-slate-700 text-slate-300 hover:text-rose-300 transition">
            Logout
          </button>
        ` : '';
      }
    }

    async function doLogin() {
      const usernameEl = document.getElementById('login-username');
      const passwordEl = document.getElementById('login-password');
      const errEl = document.getElementById('login-error');
      const btnEl = document.getElementById('login-submit-btn');
      if (!usernameEl || !passwordEl) return;
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      if (errEl) errEl.classList.add('hidden');

      if (!username || !password) {
        if (errEl) { errEl.textContent = 'Please enter username and password.'; errEl.classList.remove('hidden'); }
        return;
      }

      if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Logging in...'; }
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        auth = { token: data.token, username: data.username, role: data.role };
        localStorage.setItem('cs_auth', JSON.stringify(auth));
        renderUserBox();
        renderNav();
        renderScreen();
        checkHealth();
        refreshFacilityLabel();
        toast(`Welcome, ${auth.username}`, 'success');
      } catch (e) {
        if (errEl) {
          errEl.textContent = e.detail || 'Login failed. Incorrect username or password.';
          errEl.classList.remove('hidden');
        }
      } finally {
        if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'Login'; }
      }
    }

    function logout() {
      auth = { token: null, username: null, role: null };
      localStorage.removeItem('cs_auth');
      if (sseSource) { sseSource.close(); sseSource = null; }
      renderUserBox();
      renderNav();
      renderScreen();
    }

    function renderLoginScreen() {
      const c = document.getElementById('app-container');
      if (!c) return;
      c.innerHTML = `
        <div class="max-w-md mx-auto mt-10 md:mt-20">
          <div class="glass-card p-8 shadow-2xl border border-slate-700">
            <h2 class="text-xl font-black text-white tracking-tight mb-1">Login</h2>
            <p class="text-xs text-slate-400 mb-6">Enter your credentials to access the Bag Counter System.</p>

            <div class="space-y-3.5">
              <div>
                <label class="text-xs text-slate-400 font-semibold block mb-1">Username</label>
                <input type="text" id="login-username" autocomplete="username" class="w-full" placeholder="username">
              </div>
              <div>
                <label class="text-xs text-slate-400 font-semibold block mb-1">Password</label>
                <input type="password" id="login-password" autocomplete="current-password" class="w-full" placeholder="••••••••" onkeydown="if(event.key === 'Enter') doLogin()">
              </div>
              <div id="login-error" class="hidden text-xs text-rose-400 font-medium"></div>
              <button id="login-submit-btn" onclick="doLogin()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">
                Login
              </button>
            </div>
          </div>
        </div>
      `;
      const usernameEl = document.getElementById('login-username');
      if (usernameEl) usernameEl.focus();
    }

    (function init() {
      const saved = localStorage.getItem('cs_auth');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.token) {
            auth = parsed;
            renderUserBox();
            renderNav();
            renderScreen();
            checkHealth();
            refreshFacilityLabel();
            return;
          }

    function renderAuxCamWall(cameras) {
      const wall = document.getElementById('aux-cam-wall');
      if (!wall) return;
      wall.classList.toggle('grid-mode', auxCamGridMode);
      if (!auxCamHeroId || !cameras.some(c => c.id === auxCamHeroId)) {
        auxCamHeroId = cameras[0].id;
      }
      const heroEl = document.getElementById('aux-cam-hero');
      const thumbsEl = document.getElementById('aux-cam-thumbs');
      const hero = cameras.find(c => c.id === auxCamHeroId);
      heroEl.innerHTML = auxCamTileHtml(hero);

      if (auxCamGridMode) {
        const cols = Math.max(2, Math.ceil(Math.sqrt(cameras.length * 1.6)));
        wall.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        thumbsEl.innerHTML = cameras.map(cam => auxCamTileHtml(cam)).join('');
      } else {
        wall.style.gridTemplateColumns = '';
        thumbsEl.innerHTML = cameras.filter(c => c.id !== auxCamHeroId).map(cam => `
          <div class="cam-thumb" onclick="promoteAuxCam(${cam.id})" title="Click to enlarge">
            <img src="${API}/cameras/${cam.id}/stream" alt="CAM-${cam.id}">
            <div class="th-label">CAM-${cam.id} · ${escapeHtml(CAMERA_ROLE_LABELS[cam.role] || cam.role)}</div>
          </div>
        `).join('');
        requestAnimationFrame(() => {
          const wrap = document.getElementById('aux-cam-thumbs-wrap');
          const existing = document.getElementById('aux-cam-thumbs-more');
          if (existing) existing.remove();
          if (thumbsEl.scrollHeight > thumbsEl.clientHeight + 2) {
            const div = document.createElement('div');
            div.id = 'aux-cam-thumbs-more';
            div.className = 'cam-thumbs-more';
            div.textContent = '↓ scroll for more cameras';
            wrap.appendChild(div);
          }
        });
      }
    }

      try {

      try {

        ids.forEach(id => { const el = document.getElementById(id); if (el) el.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse'; });

      const els = [document.getElementById('current-line-label'), document.getElementById('current-line-label-rail')].filter(Boolean);
      if (els.length === 0 || !auth.token) return;
      try {
        const sites = await api('/sites');

    // ===================== WEBRTC & ADVANCED INTERACTIVE TOOLS (§6.1, §6.8) =====================
    let isWebRTCActive = false;
    let localMediaStream = null;
    let isDraggingGateEnabled = true;
    let isDraggingGate = false;
    let roiDrawMode = false;
    let roiPoints = [[80, 55], [680, 55], [680, 245], [80, 245]];
    let perspectiveMode = false;
    let warpPoints = [];
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(type = 'count') {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        if (type === 'count' || type === 'normal' || type === true) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.09);
        } else if (type === 'multi') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.setValueAtTime(1174, audioCtx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'defect') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.26);
        }
      } catch {}
    }

    async function toggleWebRTC() {
      if (isWebRTCActive) {
        if (localMediaStream) {
          localMediaStream.getTracks().forEach(t => t.stop());
          localMediaStream = null;
        }
        isWebRTCActive = false;
        toast('WebRTC camera stopped', 'info');
      } else {
        try {
          let video = document.getElementById('webcamVideo');
          if (!video) {
            video = document.createElement('video');
            video.id = 'webcamVideo';
            video.autoplay = true;
            video.playsInline = true;
            video.muted = true;
            video.style.display = 'none';
            document.body.appendChild(video);
          }
          localMediaStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' }
          });
          video.srcObject = localMediaStream;
          await video.play();
          isWebRTCActive = true;
          feedMode = 'canvas';
          toast('📷 Live WebRTC camera connected (60 FPS)', 'success');
        } catch (err) {
          toast('Could not access camera: ' + (err.message || err.name), 'error');
          isWebRTCActive = false;
        }
      }
      renderScreen();
    }

      const img = document.getElementById('liveVideoFeed');

        finishRoiDraw();

        roiPoints = [];
      }

    async function submitRoiPolygon(lineId, normalizedPoints) {
      try {
        const res = await api(`/lines/${lineId}/roi`, {
          method: 'POST',
          body: JSON.stringify({ roi_polygon: normalizedPoints })
        });
        toast(`✓ Counting Area (ROI) saved and activated (Config #${res.config_version_id})`, 'success');
      } catch (e) {
        toast(e.detail || 'Could not save Counting Area (ROI)', 'error');
      }
    }

    function finishRoiDraw() {
      const canvas = document.getElementById('conveyorCanvas');
      const img = document.getElementById('liveVideoFeed');
      let w = 760, h = 300;
      if (feedMode === 'stream' && img) {
        w = img.naturalWidth || 640;
        h = img.naturalHeight || 640;
      } else if (canvas) {
        w = canvas.width;
        h = canvas.height;
      }
      const normalized = roiPoints.map(([x, y]) => [Math.min(1, Math.max(0, x / w)), Math.min(1, Math.max(0, y / h))]);
      submitRoiPolygon(roiLineId, normalized);
    }

    let perspectiveLineId = 1;

    function togglePerspectiveWarp(lineId) {
      perspectiveMode = !perspectiveMode;
      perspectiveLineId = lineId || perspectiveLineId;
      const btn = document.getElementById('warp-btn');
      if (btn) btn.className = `px-2.5 py-1 rounded ${perspectiveMode ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-300'} border border-slate-700 font-semibold flex items-center space-x-1 transition`;
      const img = document.getElementById('liveVideoFeed');
      if (img) img.classList.toggle('cursor-crosshair', perspectiveMode);
      if (perspectiveMode) {
        warpPoints = [];
        toast('📐 Top-Down Perspective: Click the 4 corners of the conveyor in order [1, 2, 3, 4]', 'info');
      } else if (warpPoints.length < 4) {
        toast('Perspective calibration cancelled (4 points required)', 'info');
        warpPoints = [];
      }
    }

    async function submitPerspectiveCalibration(lineId, points) {
      try {
        const res = await api(`/calibrations/${lineId}/perspective`, {
          method: 'POST',
          body: JSON.stringify({ roi_src_points: points })
        });
        toast('✓ 4-Point Homography Perspective Correction Active! (Calibration #' + res.calibration_id + ')', 'success');
      } catch (e) {
        toast(e.detail || 'Could not save perspective calibration', 'error');
      }
    }

    function handleStreamClick(event, lineId) {
      if (!perspectiveMode && !roiDrawMode) return;
      const img = event.target;
      const rect = img.getBoundingClientRect();
      const natW = img.naturalWidth || 640;
      const natH = img.naturalHeight || 640;
      const x = Math.round(((event.clientX - rect.left) / rect.width) * natW);
      const y = Math.round(((event.clientY - rect.top) / rect.height) * natH);

      if (roiDrawMode) {
        roiPoints.push([x, y]);
        toast(`Point ${roiPoints.length}/6 marked (click 'Counting Area' again to finish)`, 'info');
        if (roiPoints.length >= 6) {
          roiDrawMode = false;
          img.classList.remove('cursor-crosshair');
          const btn = document.getElementById('roi-draw-btn');
          if (btn) btn.className = `px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold flex items-center space-x-1 transition`;
          finishRoiDraw();
        }
        return;
      }

      warpPoints.push([x, y]);
      toast(`Point ${warpPoints.length}/4 marked`, 'info');
      if (warpPoints.length >= 4) {
        perspectiveMode = false;
        img.classList.remove('cursor-crosshair');
        const btn = document.getElementById('warp-btn');
        if (btn) btn.className = `px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold flex items-center space-x-1 transition`;
        submitPerspectiveCalibration(lineId, warpPoints);
      }
    }

    // ===================== CANVAS ANIMATION & EVENT BINDINGS =====================
    function initConveyorCanvas(sessionId) {
      const canvas = document.getElementById('conveyorCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let beltOffset = 0;
      bagsOnBelt = [];

      bagsOnBelt.push({ x: 80, y: 85, width: 85, height: 120, label: activeBagLabel, id: nextTrackId++, hasPassed: false, isDefect: false, isMulti: false });
      bagsOnBelt.push({ x: 270, y: 85, width: 85, height: 120, label: activeBagLabel, id: nextTrackId++, hasPassed: false, isDefect: false, isMulti: false });

      canvas.onmousedown = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = ((e.clientX - rect.left) / rect.width) * canvas.width;
        const mouseY = ((e.clientY - rect.top) / rect.height) * canvas.height;

        if (roiDrawMode) {
          roiPoints.push([Math.round(mouseX), Math.round(mouseY)]);
          toast(`Point ${roiPoints.length}/6 marked (click again to finish)`, 'info');
          if (roiPoints.length >= 6) {
            roiDrawMode = false;
            const btn = document.getElementById('roi-draw-btn');
            if (btn) btn.className = `px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold flex items-center space-x-1 transition`;
            finishRoiDraw();
          }
          return;
        }

        if (perspectiveMode) {
          warpPoints.push([Math.round(mouseX), Math.round(mouseY)]);
          toast(`Point ${warpPoints.length}/4 marked`, 'info');
          if (warpPoints.length >= 4) {
            perspectiveMode = false;
            const btn = document.getElementById('warp-btn');
            if (btn) btn.className = `px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold flex items-center space-x-1 transition`;
            submitPerspectiveCalibration(perspectiveLineId, warpPoints);
          }
          return;
        }

        if (Math.abs(mouseX - opticalGateX) < 40 || isDraggingGateEnabled) {
          isDraggingGate = true;
          opticalGateX = Math.max(100, Math.min(canvas.width - 100, Math.round(mouseX)));
          setGateX(1, opticalGateX);
        }
      };

      canvas.onmousemove = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = ((e.clientX - rect.left) / rect.width) * canvas.width;
        if (isDraggingGate) {
          opticalGateX = Math.max(100, Math.min(canvas.width - 100, Math.round(mouseX)));
          setGateX(1, opticalGateX);
        }
      };

      canvas.onmouseup = () => { isDraggingGate = false; };
      canvas.onmouseleave = () => { isDraggingGate = false; };

      function animate() {
        if (!document.getElementById('conveyorCanvas')) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const webcam = document.getElementById('webcamVideo');
        if (isWebRTCActive && webcam && webcam.readyState >= 2) {
          ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 50, canvas.width, 200);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 4;
          ctx.strokeRect(0, 50, canvas.width, 200);

          const step = (isAutoSimRunning ? 1.5 : 0.6) * beltSpeedFactor * beltDirection;
          beltOffset = (beltOffset + step) % 40;
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 2;
          for (let x = -40 + beltOffset; x < canvas.width + 40; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 52);
            ctx.lineTo(x, 248);
            ctx.stroke();
          }

          ctx.fillStyle = 'rgba(100, 116, 139, 0.22)';
          ctx.font = 'bold 20px monospace';
          ctx.fillText(beltDirection > 0 ? 'CONVEYOR FLOW DIRECTION ➔ ➔ ➔' : '⬅ ⬅ ⬅ CONVEYOR FLOW DIRECTION', 200, 155);
        }

        if (roiPoints.length > 1) {
          ctx.save();
          ctx.strokeStyle = '#06b6d4';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 3]);
          ctx.beginPath();
          ctx.moveTo(roiPoints[0][0], roiPoints[0][1]);
          for (let p = 1; p < roiPoints.length; p++) ctx.lineTo(roiPoints[p][0], roiPoints[p][1]);
          if (roiPoints.length > 2 && !roiDrawMode) ctx.closePath();
          ctx.stroke();
          ctx.fillStyle = 'rgba(6, 182, 212, 0.08)';
          ctx.fill();
          ctx.setLineDash([]);
          roiPoints.forEach((pt) => {
            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.arc(pt[0], pt[1], 4, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        }

        if (warpPoints.length > 0) {
          ctx.save();
          ctx.strokeStyle = '#a855f7';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(warpPoints[0][0], warpPoints[0][1]);
          for (let w = 1; w < warpPoints.length; w++) ctx.lineTo(warpPoints[w][0], warpPoints[w][1]);
          if (warpPoints.length === 4) ctx.closePath();
          ctx.stroke();
          ctx.fillStyle = 'rgba(168, 85, 247, 0.12)';
          ctx.fill();
          warpPoints.forEach((pt, idx) => {
            ctx.fillStyle = '#a855f7';
            ctx.fillRect(pt[0] - 8, pt[1] - 8, 16, 16);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText(`${idx + 1}`, pt[0] - 3, pt[1] + 3);
          });
          ctx.restore();
        }

        const gateX = opticalGateX;
        ctx.save();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = isDraggingGate ? 5 : 3;
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(gateX, 35);
        ctx.lineTo(gateX, 265);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#059669';
        ctx.fillRect(gateX - 50, 22, 100, 22);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('↔️ COUNTING GATE', gateX, 37);

        const speed = (isAutoSimRunning ? 2.0 : 0.8) * beltSpeedFactor * beltDirection;
        for (let i = bagsOnBelt.length - 1; i >= 0; i--) {
          const bag = bagsOnBelt[i];
          bag.x += speed;

          if (beltDirection > 0 && !bag.hasPassed && bag.x + bag.width / 2 >= gateX) {
            bag.hasPassed = true;
            triggerGateCrossingVisual(bag.isDefect ? 'defect' : (bag.isMulti ? 'multi' : 'normal'));
            playBeep(bag.isDefect ? 'defect' : (bag.isMulti ? 'multi' : 'count'));
            api(`/sessions/${sessionId}/simulate_bag`, { method: 'POST', body: JSON.stringify({ direction: bag.isMulti ? 2 : 1 }) })
              .then(res => updateCounterUI(res.counted_total, res.area_estimate_total))
              .catch(() => {});
          } else if (beltDirection < 0 && !bag.hasPassed && bag.x + bag.width / 2 <= gateX) {
            bag.hasPassed = true;
            triggerGateCrossingVisual(bag.isDefect ? 'defect' : (bag.isMulti ? 'multi' : 'normal'));
            playBeep(bag.isDefect ? 'defect' : (bag.isMulti ? 'multi' : 'count'));
            api(`/sessions/${sessionId}/simulate_bag`, { method: 'POST', body: JSON.stringify({ direction: bag.isMulti ? 2 : 1 }) })
              .then(res => updateCounterUI(res.counted_total, res.area_estimate_total))
              .catch(() => {});
          }

          ctx.save();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
          ctx.beginPath();
          ctx.roundRect(bag.x + 4, bag.y + 4, bag.width, bag.height, 12);
          ctx.fill();

          const grad = ctx.createLinearGradient(bag.x, bag.y, bag.x + bag.width, bag.y + bag.height);
          if (bag.isDefect) {
            grad.addColorStop(0, '#f87171');
            grad.addColorStop(1, '#dc2626');
          } else if (bag.isMulti) {
            grad.addColorStop(0, '#fbbf24');
            grad.addColorStop(1, '#f59e0b');
          } else if (activeBagColor === 'poly_white') {
            grad.addColorStop(0, '#f8fafc');
            grad.addColorStop(1, '#e2e8f0');
          } else if (activeBagColor === 'mortar_gray') {
            grad.addColorStop(0, '#94a3b8');
            grad.addColorStop(1, '#64748b');
          } else {
            grad.addColorStop(0, '#fef08a');
            grad.addColorStop(1, '#fde047');
          }

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect(bag.x, bag.y, bag.width, bag.height, 10);
          ctx.fill();

          if (bag.isDefect) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(bag.x - 4, bag.y - 22, bag.width + 8, 18);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`🚨 DEFECT ${bag.id}`, bag.x, bag.y - 9);
          } else if (bag.isMulti) {
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#d97706';
            ctx.fillRect(bag.x - 4, bag.y - 22, bag.width + 8, 18);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`📦 2x MERGED BAGS`, bag.x, bag.y - 9);
          } else {
            ctx.strokeStyle = activeBagColor === 'poly_white' ? '#94a3b8' : activeBagColor === 'mortar_gray' ? '#475569' : '#eab308';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 2]);
            ctx.strokeRect(bag.x - 4, bag.y - 4, bag.width + 8, bag.height + 8);
            ctx.setLineDash([]);

            ctx.fillStyle = '#4f46e5';
            ctx.fillRect(bag.x - 4, bag.y - 20, bag.width + 8, 16);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`TRK-${bag.id} 99%`, bag.x - 1, bag.y - 8);
          }

          ctx.fillStyle = bag.isDefect ? '#ffffff' : (activeBagColor === 'poly_white' ? '#1e293b' : activeBagColor === 'mortar_gray' ? '#0f172a' : '#713f12');
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(bag.isDefect ? 'DAMAGED / TORN' : bag.label.slice(0, 16), bag.x + bag.width / 2, bag.y + bag.height / 2 - 6);
          ctx.font = '9px sans-serif';
          ctx.fillText('FABRIC #2026', bag.x + bag.width / 2, bag.y + bag.height / 2 + 10);
          ctx.restore();

          if (beltDirection > 0 && bag.x > canvas.width + 100) {
            bagsOnBelt.splice(i, 1);
          } else if (beltDirection < 0 && bag.x < -150) {
            bagsOnBelt.splice(i, 1);
          }
        }

        if (isAutoSimRunning) {
          if (beltDirection > 0) {
            const lastBag = bagsOnBelt[bagsOnBelt.length - 1];
            if (!lastBag || lastBag.x > 220) {
              bagsOnBelt.push({
                x: -100,
                y: 85,
                width: 85,
                height: 120,
                label: activeBagLabel,
                id: nextTrackId++,
                hasPassed: false,
                isDefect: false,
                isMulti: false
              });
            }
          } else {
            const firstBag = bagsOnBelt[0];
            if (!firstBag || firstBag.x < canvas.width - 220) {
              bagsOnBelt.unshift({
                x: canvas.width + 80,
                y: 85,
                width: 85,
                height: 120,
                label: activeBagLabel,
                id: nextTrackId++,
                hasPassed: false,
                isDefect: false,
                isMulti: false
              });
            }
          }
        }

        canvasAnimationId = requestAnimationFrame(animate);
      }

      animate();
    }

    function triggerGateCrossingVisual(type = 'normal') {
      const flash = document.getElementById('gate-flash-overlay');
      if (flash) {
        flash.className = `absolute inset-0 pointer-events-none transition-opacity duration-150 ${type === 'defect' ? 'bg-rose-500/30' : (type === 'multi' ? 'bg-amber-400/30' : 'bg-emerald-400/25')}`;
        flash.style.opacity = '0.7';
        setTimeout(() => { flash.style.opacity = '0'; }, 200);
      }
      const countEl = document.getElementById('live-count');
      if (countEl) {
        countEl.classList.add('count-pulse');
        setTimeout(() => countEl.classList.remove('count-pulse'), 350);
      }
    }

    function updateCounterUI(newCount, newArea) {
      const countEl = document.getElementById('live-count');
      const areaEl = document.getElementById('live-area');
      const pctEl = document.getElementById('live-pct');
      const barEl = document.getElementById('live-progress-bar');
      if (countEl && newCount !== undefined) countEl.textContent = newCount;
      if (areaEl && newArea !== undefined) areaEl.textContent = Number(newArea).toFixed(1);
      if (pctEl && newCount !== undefined) {
        const pct = Math.min(100, Math.round((newCount / 200) * 100));
        pctEl.textContent = pct;
        if (barEl) barEl.style.width = pct + '%';
      }
    }

    function triggerSimPass(sessId, direction = 1, type = 'normal') {
      initAudio();
      if (type === 'multi') {
        bagsOnBelt.push({
          x: beltDirection > 0 ? -120 : 780,
          y: 85,
          width: 175,
          height: 120,
          label: '2x Merged Bags',
          id: nextTrackId++,
          hasPassed: false,
          isDefect: false,
          isMulti: true
        });
      } else if (type === 'defect') {
        bagsOnBelt.push({
          x: beltDirection > 0 ? -90 : 750,
          y: 90,
          width: 80,
          height: 110,
          label: 'Damaged Bag',
          id: nextTrackId++,
          hasPassed: false,
          isDefect: true,
          isMulti: false
        });
      } else if (type === 'normal') {
        bagsOnBelt.push({
          x: beltDirection > 0 ? -90 : 750,
          y: 85,
          width: 85,
          height: 120,
          label: activeBagLabel,
          id: nextTrackId++,
          hasPassed: false,
          isDefect: false,
          isMulti: false
        });
      }

      api(`/sessions/${sessId}/simulate_bag`, { method: 'POST', body: JSON.stringify({ direction }) })
        .then(res => {
          updateCounterUI(res.counted_total, res.area_estimate_total);
          playBeep(type);
          triggerGateCrossingVisual(type);
          if (type === 'multi') toast('📦 2x Merged Bags Disambiguated (+2)', 'warn');
          else if (type === 'defect') toast('🚨 Damaged Bag Warning! (Defect Alert)', 'error');
          else if (type === 'rollback') toast('🔁 Double-Count Corrected: -1', 'warn');
          else toast('⚡ +1 Bag Passed', 'success');
        })
        .catch(e => toast(e.detail || 'Action failed', 'error'));
    }

      try {

        sseSource.onmessage = (e) => {
          try {
            const d = JSON.parse(e.data);
            if (d.counted_total !== undefined) {
              updateCounterUI(d.counted_total, d.area_estimate);
            }
            const fpsEl = document.getElementById('live-fps');
            if (fpsEl) fpsEl.textContent = (d.fps !== undefined && d.fps !== null) ? `${Number(d.fps).toFixed(1)} FPS` : '— FPS';

    function csvField(value) {
      let s = String(value ?? '');
      if (/^[=+\-@]/.test(s)) s = '\t' + s;
      return `"${s.replace(/"/g, '""')}"`;
    }

    function exportSessionsCSV() {
      api('/sessions').then(sessions => {
        let csv = 'ID,External_Ref,Line_ID,Target,Counted_Total,Area_Estimate,Status\n';
        sessions.forEach(s => {
          csv += [
            csvField(s.id), csvField(s.external_ref || ''), csvField(s.line_id),
            csvField(s.target_count || ''), csvField(s.counted_total || 0),
            csvField(s.area_estimate_total || 0), csvField(s.status),
          ].join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `dispatch_report_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        toast('CSV report downloaded', 'success');
      });
    }

    async function downloadModelOnnx(modelId) {
      try {
        const res = await fetch(`${API}/models/${modelId}/download`, { headers: headers(false) });
        if (!res.ok) {
          let msg = 'Could not download ONNX';
          try { const j = await res.json(); msg = j.detail || msg; } catch {}
          throw new Error(msg);
        }
        const blob = await res.blob();
        const cd = res.headers.get('Content-Disposition') || '';
        const match = /filename="?([^"]+)"?/.exec(cd);
        const filename = match ? match[1] : `model_${modelId}.onnx`;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        toast('Downloading ONNX model...', 'success');
      } catch (e) {
        toast(e.message || 'Could not download ONNX', 'error');
      }
    }

    async function startTrainingRun() {
      const epochs = parseInt(document.getElementById('train-epochs').value) || 50;
      const batch = parseInt(document.getElementById('train-batch').value) || 16;
      try {
        const res = await api('/training/runs', {
          method: 'POST',
          body: JSON.stringify({ epochs, batch_size: batch, model: 'rf_detr' })
        });
        toast(`Training job started: Job #${res.job_id}`, 'success');
      } catch (e) {
        toast(e.detail || 'Could not start training', 'error');
      }
    }

    async function createGateForLine(lineId) {
      const name = document.getElementById(`add-gate-name-${lineId}`).value.trim();
      const orderIndex = parseInt(document.getElementById(`add-gate-order-${lineId}`).value, 10) || 0;
      if (!name) {
        toast('Please enter gate name.', 'error');
        return;
      }
      try {
        const gate = await api('/gates', {
          method: 'POST',
          body: JSON.stringify({ line_id: lineId, name, order_index: orderIndex }),
        });
        toast(`Gate added: GATE-${gate.id}`, 'success');
        renderScreen();
      } catch (e) {
        toast(e.detail || 'Could not add gate', 'error');
      }
    }

    async function ensureNodeForSite(siteId) {
      const nodes = await api(`/nodes?site_id=${siteId}`);
      if (nodes.length > 0) return nodes[0].id;
      const node = await api('/nodes', { method: 'POST', body: JSON.stringify({ site_id: siteId, hostname: `edge-${siteId}-01` }) });
      return node.id;
    }

    function buildCameraSourceConfig(driver, sourceValue) {
      if (driver === 'usb') return { device_index: parseInt(sourceValue.replace('#', ''), 10) || 0 };
      if (driver === 'file') return { path: sourceValue };
      return { rtsp_url: sourceValue };
    }

    async function createCameraForLine(lineId, siteId) {
      const role = document.getElementById(`add-cam-role-${lineId}`).value;
      const driver = document.getElementById(`add-cam-driver-${lineId}`).value;
      const sourceValue = document.getElementById(`add-cam-source-${lineId}`).value.trim();
      if (!sourceValue) {
        toast('Please enter camera source (RTSP address, #0 device index, or file path).', 'error');
        return;
      }
      try {
        const nodeId = await ensureNodeForSite(siteId);
        const cam = await api('/cameras', {
          method: 'POST',
          body: JSON.stringify({ line_id: lineId, node_id: nodeId, source_driver: driver, source_config: buildCameraSourceConfig(driver, sourceValue), role }),
        });
        await api(`/cameras/${cam.id}/source`, {
          method: 'POST',
          body: JSON.stringify({ source_config: buildCameraSourceConfig(driver, sourceValue), source_driver: driver }),
        });
        toast(`Camera added: CAM-${cam.id}`, 'success');
        renderScreen();
      } catch (e) {
        toast(e.detail || 'Could not add camera', 'error');
      }
    }

    async function testCameraFeed(camId) {
      const resultEl = document.getElementById(`cam-test-result-${camId}`);
      if (resultEl) resultEl.textContent = 'Testing…';
      try {
        const res = await api(`/cameras/${camId}/test`, { method: 'POST' });
        if (resultEl) {
          resultEl.textContent = res.connected ? '✓ Connected' : '✗ Failed';
          resultEl.className = `text-[11px] font-bold ${res.connected ? 'text-emerald-400' : 'text-rose-400'}`;
        }
        toast(res.message, res.connected ? 'success' : 'error');
      } catch (e) {
        if (resultEl) resultEl.textContent = '✗ Error';
        toast(e.detail || 'Test failed', 'error');
      }
    }

    }
  </script>

  <!-- Dispatch & Reconciliation Manifest Modal (§5.7, §5.8) -->
  <div id="dispatch-report-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
    <div class="glass-card max-w-3xl w-full p-8 border border-slate-700 shadow-2xl relative max-h-[90vh] overflow-y-auto bg-slate-900 rounded-3xl">
      <button onclick="closeDispatchReportModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white text-xl">✕</button>
      <div id="dispatch-report-content">
        <!-- Injected dynamically via openDispatchReportModal() -->
      </div>
    </div>
  </div>
</body>
</html>
