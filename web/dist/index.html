<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayım Sistemi</title>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    :root {
      --bg-main: #0b1120;
      --card-bg: rgba(15, 23, 42, 0.88);
      --border-color: rgba(51, 65, 85, 0.7);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-green: #10b981;
    }
    * { box-sizing: border-box; }
    body { background-color: var(--bg-main); color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.65rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.025em; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; padding: 0.85rem 1.4rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.6); animation: slideIn 0.25s ease-out; }
    @keyframes slideIn { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes countPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); color: #34d399; } 100% { transform: scale(1); } }
    .count-pulse { animation: countPulse 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    .spinner { border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; width: 1.5rem; height: 1.5rem; animation: spin 0.6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    input, select, textarea { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 0.5rem; padding: 0.55rem 0.85rem; font-size: 0.875rem; transition: all 0.15s ease; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.35); }
    .digital-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 1.25rem; }
    .glass-card:hover { border-color: rgba(99, 102, 241, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ===================== MAIN APP SHELL ===================== -->
  <div id="app-shell" class="flex-1 flex flex-col min-h-screen">
    <!-- Top Navigation Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 md:px-6 py-3 sticky top-0 z-40 flex items-center justify-between shadow-xl">
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2.5 cursor-pointer" onclick="setTab('live')">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white text-sm shadow-md shadow-indigo-500/20">CS</div>
          <div>
            <div class="text-base font-extrabold tracking-tight text-white leading-tight">Sayım Sistemi</div>
            <div class="text-[10px] text-slate-400 font-mono" id="current-line-label">Tesis ayarlanmadı</div>
          </div>
        </div>

        <!-- Role Nav Menu -->
        <nav id="nav-menu" class="hidden lg:flex space-x-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/50 text-xs font-semibold"></nav>
      </div>

      <!-- Right Controls -->
      <div class="flex items-center space-x-2 md:space-x-3">
        <!-- Sound Toggle -->
        <button onclick="toggleAudio()" id="audio-toggle-btn" class="p-2 bg-slate-800/80 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 text-xs flex items-center space-x-1.5 transition" title="Sayım ses efektini aç/kapat">
          <span id="audio-icon">🔊</span>
          <span class="hidden sm:inline text-[11px]" id="audio-label">Ses Açık</span>
        </button>

        <!-- Live Health Pulse -->
        <div class="flex items-center space-x-2 bg-slate-800/60 px-3 py-1.5 rounded-lg border border-slate-700/50">
          <span id="health-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs text-slate-300 font-medium hidden sm:inline" id="live-indicator">Sistem Canlı</span>
        </div>

        <!-- Authenticated User Box (populated by renderUserBox()) -->
        <div id="user-box" class="border-l border-slate-700 pl-2 md:pl-3 flex items-center space-x-2"></div>
      </div>
    </header>

    <!-- Mobile Navigation Bar -->
    <div class="lg:hidden bg-slate-900 border-b border-slate-800 px-4 py-2 overflow-x-auto flex space-x-2 text-xs" id="mobile-nav-menu"></div>

    <!-- Main Dynamic Screen Viewport -->
    <main id="app-container" class="flex-1 p-4 md:p-6 max-w-7xl w-full mx-auto"></main>
  </div>

  <!-- Event Ledger Detail Modal -->
  <div id="ledger-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass-card max-w-3xl w-full p-6 shadow-2xl border border-slate-700 flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center pb-4 border-b border-slate-800">
        <div>
          <h3 class="text-lg font-bold text-white flex items-center space-x-2">
            <span>📜 Sayım Defteri (Count Event Ledger)</span>
            <span class="text-xs text-indigo-400 font-mono" id="ledger-modal-sess-title"></span>
          </h3>
          <p class="text-xs text-slate-400">Tek hakikat kaynağı: Salt-eklemeli (append-only) değişmez olay kayıtları (§5.5).</p>
        </div>
        <button onclick="document.getElementById('ledger-modal').classList.add('hidden')" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>
      <div class="flex-1 overflow-y-auto my-4 pr-1" id="ledger-modal-body">
        <div class="text-center py-10"><div class="spinner"></div></div>
      </div>
      <div class="pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
        <span id="ledger-modal-count-summary">Toplam: 0 Olay</span>
        <button onclick="document.getElementById('ledger-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-medium">Kapat</button>
      </div>
    </div>
  </div>

  <!-- Product / Bag Profile Customizer Modal -->
  <div id="bag-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass-card max-w-xl w-full p-6 shadow-2xl border border-slate-700">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
        <h3 class="text-base font-bold text-white flex items-center space-x-2">
          <span>📦 Yeni Çuval / Ürün Profili Tanımla (§5.2)</span>
        </h3>
        <button onclick="document.getElementById('bag-modal').classList.add('hidden')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="space-y-3.5 text-xs">
        <div>
          <label class="text-slate-400 font-semibold block mb-1">Ürün / Çuval Adı</label>
          <input type="text" id="modal-bag-name" placeholder="Örn: 50kg Süper Kraft Çimento" class="w-full">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">ERP Malzeme Kodu</label>
            <input type="text" id="modal-bag-erp" placeholder="MAT-CIM-50" class="w-full font-mono">
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Nominal Ağırlık (kg)</label>
            <input type="number" id="modal-bag-weight" value="50" class="w-full">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Genişlik (W mm)</label>
            <input type="number" id="modal-bag-w" value="480" class="w-full">
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Uzunluk (L mm)</label>
            <input type="number" id="modal-bag-l" value="650" class="w-full">
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Kalınlık (H mm)</label>
            <input type="number" id="modal-bag-h" value="130" class="w-full">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Çuval Rengi / Malzemesi</label>
            <select id="modal-bag-color" class="w-full">
              <option value="kraft_yellow">Sarı Kraft Torba</option>
              <option value="poly_white">Beyaz Polietilen / Dokuma</option>
              <option value="mortar_gray">Gri Kuru Harç Torbası</option>
              <option value="red_special">Kırmızı Özel Harç</option>
            </select>
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">Alan Toleransı (±%)</label>
            <input type="number" id="modal-bag-tol" value="6.0" class="w-full">
          </div>
        </div>
      </div>
      <div class="mt-6 pt-4 border-t border-slate-800 flex justify-end space-x-2">
        <button onclick="document.getElementById('bag-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl">İptal</button>
        <button onclick="saveNewBagProfile()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-md">Kaydet & Aktif Et</button>
      </div>
    </div>
  </div>

  <!-- Hidden Video File Input -->
  <input type="file" id="video-file-input" accept="video/mp4,video/avi,video/mkv,video/mov" class="hidden">

  <script>
    const API = '/api';
    let auth = { token: null, username: null, role: null };
    let activeTab = 'live';
    let sseSource = null;

    // Live Feed Mode: 'stream' (Real OpenCV MJPEG) or 'canvas' (60 FPS Simulator)
    let feedMode = 'stream';

    // Conveyor & Belt Settings State
    let beltSpeedFactor = 2.5; // 1.0 to 5.0
    let opticalGateX = 480;    // 150 to 650 px
    let beltDirection = 1;     // +1: Left to Right, -1: Right to Left
    let activeBagColor = 'kraft_yellow';
    let activeBagLabel = '50kg Çimento';

    // Simulation animation state (for canvas mode)
    let isAutoSimRunning = true;
    let canvasAnimationId = null;
    let bagsOnBelt = [];
    let nextTrackId = 1050;

    function toggleAudio() {
      toggleAudioFeedback();
    }

    // ===================== HTTP & API HELPERS =====================
    function headers(hasBody = false) {
      const h = {};
      if (auth.token) h['Authorization'] = 'Bearer ' + auth.token;
      if (hasBody) h['Content-Type'] = 'application/json';
      return h;
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, { headers: headers(!!opts.body), ...opts });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      if (!res.ok) throw { status: res.status, detail: (data && data.detail) ? data.detail : text };
      return data;
    }

    // Escapes any API- or user-supplied string before it is interpolated into
    // an innerHTML template literal, to prevent stored/reflected XSS from
    // names, refs, notes and other free-text fields coming back from the API.
    // Numbers/booleans/fixed enum values from trusted internal computation
    // don't strictly need this, but it's harmless to apply broadly.
    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white border border-emerald-400/40',
        error: 'bg-rose-600 text-white border border-rose-400/40',
        warn: 'bg-amber-600 text-white border border-amber-400/40',
        info: 'bg-indigo-600 text-white border border-indigo-400/40',
      };
      el.className = `toast ${colors[type] || colors.success}`;
      el.innerHTML = `<span>${type === 'error' ? '⚠️' : type === 'warn' ? '🔔' : type === 'info' ? 'ℹ️' : '✅'}</span> <span class="ml-1.5">${escapeHtml(msg)}</span>`;
      document.body.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(1rem)';
        el.style.transition = 'all 0.3s ease-out';
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    // ===================== AUTH & LOGIN =====================
    // Real authentication: the only way to become operator/engineer/admin is
    // to submit real credentials to POST /auth/login. There is no client-side
    // password map and no one-click role bypass. The "Demo Girişi" panel on
    // the login screen only pre-fills the *username* field for known demo
    // seed accounts (see packages/cs_storage/repositories/user_repo.py
    // seed_default_users()) -- it never carries a password, so every login,
    // demo or not, goes through the real form + real endpoint.

    function renderUserBox() {
      const el = document.getElementById('user-box');
      if (!el) return;
      if (auth.token) {
        const roleLabels = { operator: '👷 Operatör', engineer: '👨‍🔬 Mühendis', admin: '👑 Yönetici' };
        el.innerHTML = `
          <div class="hidden md:flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-xs">
            <span class="font-bold text-slate-200">${escapeHtml(auth.username)}</span>
            <span class="badge bg-indigo-500/20 text-indigo-300 text-[10px]">${escapeHtml(roleLabels[auth.role] || auth.role)}</span>
          </div>
          <button onclick="logout()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-rose-900/40 text-xs font-semibold rounded-lg border border-slate-700 text-slate-300 hover:text-rose-300 transition">
            Çıkış
          </button>
        `;
      } else {
        el.innerHTML = '';
      }
    }

    async function doLogin() {
      const usernameEl = document.getElementById('login-username');
      const passwordEl = document.getElementById('login-password');
      const errEl = document.getElementById('login-error');
      const btnEl = document.getElementById('login-submit-btn');
      if (!usernameEl || !passwordEl) return;
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      if (errEl) errEl.classList.add('hidden');

      if (!username || !password) {
        if (errEl) { errEl.textContent = 'Kullanıcı adı ve parola giriniz.'; errEl.classList.remove('hidden'); }
        return;
      }

      if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Giriş yapılıyor...'; }
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        auth = { token: data.token, username: data.username, role: data.role };
        localStorage.setItem('cs_auth', JSON.stringify(auth));
        renderUserBox();
        renderNav();
        renderScreen();
        checkHealth();
        refreshFacilityLabel();
        toast(`Hoş geldiniz, ${auth.username}`, 'success');
      } catch (e) {
        if (errEl) {
          errEl.textContent = e.detail || 'Giriş başarısız. Kullanıcı adı veya parola hatalı.';
          errEl.classList.remove('hidden');
        }
      } finally {
        if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'Giriş Yap'; }
      }
    }

    function logout() {
      auth = { token: null, username: null, role: null };
      localStorage.removeItem('cs_auth');
      if (sseSource) { sseSource.close(); sseSource = null; }
      renderUserBox();
      renderNav();
      renderScreen();
    }

    function renderLoginScreen() {
      const c = document.getElementById('app-container');
      if (!c) return;
      c.innerHTML = `
        <div class="max-w-md mx-auto mt-10 md:mt-20">
          <div class="glass-card p-8 shadow-2xl border border-slate-700">
            <h2 class="text-xl font-black text-white tracking-tight mb-1">Giriş Yap</h2>
            <p class="text-xs text-slate-400 mb-6">Sayım Sistemi'ne erişmek için hesap bilgilerinizi giriniz.</p>

            <div class="space-y-3.5">
              <div>
                <label class="text-xs text-slate-400 font-semibold block mb-1">Kullanıcı Adı</label>
                <input type="text" id="login-username" autocomplete="username" class="w-full" placeholder="kullanici.adi">
              </div>
              <div>
                <label class="text-xs text-slate-400 font-semibold block mb-1">Parola</label>
                <input type="password" id="login-password" autocomplete="current-password" class="w-full" placeholder="••••••••" onkeydown="if(event.key === 'Enter') doLogin()">
              </div>
              <div id="login-error" class="hidden text-xs text-rose-400 font-medium"></div>
              <button id="login-submit-btn" onclick="doLogin()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">
                Giriş Yap
              </button>
            </div>
          </div>
        </div>
      `;
      const usernameEl = document.getElementById('login-username');
      if (usernameEl) usernameEl.focus();
    }

    // Restore a previously saved session on launch (still a real, previously
    // issued JWT -- never a fabricated/bypassed one). Any 401 from the API
    // later (e.g. an expired token) routes back through logout()/api().
    (function init() {
      const saved = localStorage.getItem('cs_auth');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.token) {
            auth = parsed;
            renderUserBox();
            renderNav();
            renderScreen();
            checkHealth();
            refreshFacilityLabel();
            return;
          }
        } catch {}
      }
      renderUserBox();
      renderScreen();
    })();

    // ===================== NAVIGATION TABS =====================
    const MENUS = {
      operator: [
        { id: 'live', label: '📊 Canlı Sayım' },
        { id: 'sessions', label: '📋 Oturumlar' },
        { id: 'settings', label: '🔧 Bant & Kamera Ayarları' },
        { id: 'system', label: '⚙️ Sistem' },
      ],
      engineer: [
        { id: 'live', label: '📊 Canlı' },
        { id: 'sessions', label: '📋 Oturumlar' },
        { id: 'reconciliation', label: '⚖️ Mutabakat' },
        { id: 'data', label: '📁 Veri & Sentetik' },
        { id: 'training', label: '🧠 Model & Eğitim' },
        { id: 'settings', label: '🔧 Bant & Kalibrasyon' },
        { id: 'system', label: '⚙️ Sistem' },
      ],
      admin: [
        { id: 'live', label: '📊 Canlı' },
        { id: 'sessions', label: '📋 Oturumlar' },
        { id: 'reconciliation', label: '⚖️ Mutabakat' },
        { id: 'wizard', label: '🧙 Kurulum Sihirbazı' },
        { id: 'data', label: '📁 Veri & Sentetik' },
        { id: 'training', label: '🧠 Model & Eğitim' },
        { id: 'settings', label: '🔧 Bant & Kalibrasyon' },
        { id: 'system', label: '⚙️ Sistem' },
      ]
    };

    function renderNav() {
      const navEl = document.getElementById('nav-menu');
      const mobileNavEl = document.getElementById('mobile-nav-menu');
      if (!navEl || !mobileNavEl) return;

      if (!auth.token || !auth.role) {
        navEl.innerHTML = '';
        mobileNavEl.innerHTML = '';
        return;
      }

      const menu = MENUS[auth.role] || MENUS.operator;
      const tabsHtml = menu.map(m => `
        <button onclick="setTab('${m.id}')" class="px-3.5 py-1.5 rounded-lg transition whitespace-nowrap ${activeTab === m.id ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/40'}">${m.label}</button>
      `).join('');

      navEl.innerHTML = tabsHtml;
      mobileNavEl.innerHTML = tabsHtml;
    }

    function setTab(tabId) {
      activeTab = tabId;
      renderNav();
      renderScreen();
    }

    // ===================== HEALTH CHECK =====================
    async function checkHealth() {
      try {
        await api('/system/health');
        document.getElementById('health-dot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
        document.getElementById('live-indicator').textContent = 'Sistem Canlı';
      } catch {
        document.getElementById('health-dot').className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
        document.getElementById('live-indicator').textContent = 'Bağlantı Yok';
      }
    }
    setInterval(() => { if (auth.token) checkHealth(); }, 12000);

    async function refreshFacilityLabel() {
      const el = document.getElementById('current-line-label');
      if (!el || !auth.token) return;
      try {
        const sites = await api('/sites');
        el.textContent = (sites && sites.length > 0) ? sites[0].name : 'Tesis ayarlanmadı';
      } catch {
        el.textContent = 'Tesis ayarlanmadı';
      }
    }

    // ===================== SCREEN ROUTER =====================
    function renderScreen() {
      const c = document.getElementById('app-container');
      if (sseSource) { sseSource.close(); sseSource = null; }
      if (canvasAnimationId) { cancelAnimationFrame(canvasAnimationId); canvasAnimationId = null; }

      if (!auth.token) {
        renderLoginScreen();
        return;
      }

      switch (activeTab) {
        case 'live': renderLive(c); break;
        case 'sessions': renderSessions(c); break;
        case 'reconciliation': renderReconciliation(c); break;
        case 'wizard': renderWizard(c); break;
        case 'data': renderData(c); break;
        case 'training': renderTraining(c); break;
        case 'settings': renderSettings(c); break;
        case 'system': renderSystem(c); break;
        default: c.innerHTML = '<div class="text-slate-400 text-center py-20">Bilinmeyen ekran</div>';
      }
    }

    // ===================== 1. LIVE COUNTING SCREEN =====================
    async function renderLive(c) {
      c.innerHTML = '<div class="text-center py-20"><div class="spinner !w-8 !h-8"></div><div class="text-slate-400 mt-4 text-sm font-medium">Canlı OpenCV AI görüntü akışı bağlanıyor...</div></div>';
      try {
        const [lines, sessions, products] = await Promise.all([
          api('/lines'),
          api('/sessions'),
          api('/products'),
        ]);
        let otherCameras = [];
        if (lines.length > 0) {
          try { otherCameras = (await api(`/cameras?line_id=${lines[0].id}`)).filter(c => c.role !== 'counting'); } catch {}
        }

        if (lines.length === 0) {
          c.innerHTML = `
            <div class="glass-card p-10 text-center max-w-xl mx-auto my-12 shadow-2xl">
              <div class="text-4xl mb-4">🏭</div>
              <h2 class="text-2xl font-bold text-white mb-2">Tanımlı Hat Bulunmuyor</h2>
              <p class="text-slate-400 text-sm mb-6">${auth.role === 'admin'
                ? 'Fabrika topolojisini (tesis, hat, kamera) tanımlamak için Kurulum Sihirbazı\'nı kullanın.'

        feedMode = 'stream';
        renderScreen();

        toast(e.detail || 'Kameraya bağlanılamadı', 'error');

        const file = input.files[0];
        const formData = new FormData();
        formData.append('file', file);
        toast(`Video yükleniyor: ${file.name}...`, 'info');
        try {
          const res = await fetch(`${API}/lines/${lineId}/upload_video`, {
            method: 'POST',
            headers: auth.token ? { 'Authorization': 'Bearer ' + auth.token } : {},
            body: formData,
          });
          const data = await res.json();
          toast(data.message || 'Video yüklendi ve gerçek analize başlandı!', 'success');
          feedMode = 'stream';
          renderScreen();
        } catch (e) {
          toast('Video yüklenirken hata oluştu', 'error');
        }
      };
      input.click();
    }

    async function setBeltSpeed(lineId, val) {

      beltSpeedFactor = parseFloat(val);
      const el = document.getElementById('belt-speed-val');
      if (el) el.textContent = `${beltSpeedFactor.toFixed(1)}x (${(beltSpeedFactor * 0.4).toFixed(2)} m/s)`;
      try {
        await api(`/lines/${lineId}/quick_settings`, { method: 'POST', body: JSON.stringify({ belt_speed: beltSpeedFactor * 2.5 }) });
      } catch (e) {
        // Revert the optimistic UI update -- the backend never actually
        // applied this belt speed, so the display must not claim it did.
        beltSpeedFactor = prevValue;
        if (el) el.textContent = `${beltSpeedFactor.toFixed(1)}x (${(beltSpeedFactor * 0.4).toFixed(2)} m/s)`;
        const range = document.getElementById('belt-speed-range');
        if (range) range.value = beltSpeedFactor;
        toast(e.detail || 'Bant hızı kaydedilemedi. Önceki değere geri alındı.', 'error');
      }
    }

        opticalGateX = prevValue;
        if (el) el.textContent = `${opticalGateX} px`;

    // ===================== WEBRTC & ADVANCED INTERACTIVE TOOLS (§6.1, §6.8) =====================
    let isWebRTCActive = false;
    let localMediaStream = null;
    let isDraggingGateEnabled = true;
    let isDraggingGate = false;
    let roiDrawMode = false;
    let roiPoints = [[80, 55], [680, 55], [680, 245], [80, 245]];
    let perspectiveMode = false;
    let warpPoints = [];
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(type = 'count') {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        if (type === 'count' || type === 'normal' || type === true) {
          // Crisp 880Hz -> 1760Hz chime
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.09);
        } else if (type === 'multi') {
          // Two-tone chime 880Hz -> 1174Hz
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.setValueAtTime(1174, audioCtx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'defect') {
          // 220Hz saw alarm buzzer
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.26);
        }
      } catch {}
    }

    async function toggleWebRTC() {
      if (isWebRTCActive) {
        if (localMediaStream) {
          localMediaStream.getTracks().forEach(t => t.stop());
          localMediaStream = null;
        }
        isWebRTCActive = false;
        toast('WebRTC kamerası durduruldu', 'info');
      } else {
        try {
          let video = document.getElementById('webcamVideo');
          if (!video) {
            video = document.createElement('video');
            video.id = 'webcamVideo';
            video.autoplay = true;
            video.playsInline = true;
            video.muted = true;
            video.style.display = 'none';
            document.body.appendChild(video);
          }
          localMediaStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' }
          });
          video.srcObject = localMediaStream;
          await video.play();
          isWebRTCActive = true;
          feedMode = 'canvas';
          toast('📷 Canlı WebRTC kamerası bağlandı (60 FPS)', 'success');
        } catch (err) {
          toast('Kameraya erişilemedi: ' + (err.message || err.name), 'error');
          isWebRTCActive = false;
        }
      }
      renderScreen();
    }

    // ===================== CANVAS ANIMATION & EVENT BINDINGS =====================
    function initConveyorCanvas(sessionId) {
      const canvas = document.getElementById('conveyorCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let beltOffset = 0;
      bagsOnBelt = [];

      bagsOnBelt.push({ x: 80, y: 85, width: 85, height: 120, label: activeBagLabel, id: nextTrackId++, hasPassed: false, isDefect: false, isMulti: false });
      bagsOnBelt.push({ x: 270, y: 85, width: 85, height: 120, label: activeBagLabel, id: nextTrackId++, hasPassed: false, isDefect: false, isMulti: false });

      // Mouse drag and draw handlers on canvas
      canvas.onmousedown = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = ((e.clientX - rect.left) / rect.width) * canvas.width;
        const mouseY = ((e.clientY - rect.top) / rect.height) * canvas.height;

        if (roiDrawMode) {
          roiPoints.push([Math.round(mouseX), Math.round(mouseY)]);
          if (roiPoints.length >= 6) roiDrawMode = false;
          return;
        }

        if (perspectiveMode) {
          warpPoints.push([Math.round(mouseX), Math.round(mouseY)]);
          if (warpPoints.length >= 4) {
            perspectiveMode = false;
            toast('✓ 4-Nokta Homografi Perspektif Düzeltmesi Aktif!', 'success');
          }
          return;
        }

        if (Math.abs(mouseX - opticalGateX) < 40 || isDraggingGateEnabled) {
          isDraggingGate = true;
          opticalGateX = Math.max(100, Math.min(canvas.width - 100, Math.round(mouseX)));
          setGateX(1, opticalGateX);
        }
      };

      canvas.onmousemove = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = ((e.clientX - rect.left) / rect.width) * canvas.width;
        if (isDraggingGate) {
          opticalGateX = Math.max(100, Math.min(canvas.width - 100, Math.round(mouseX)));
          setGateX(1, opticalGateX);
        }
      };

      canvas.onmouseup = () => { isDraggingGate = false; };
      canvas.onmouseleave = () => { isDraggingGate = false; };

      function animate() {
        if (!document.getElementById('conveyorCanvas')) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const webcam = document.getElementById('webcamVideo');
        if (isWebRTCActive && webcam && webcam.readyState >= 2) {
          // Render Real WebRTC Video Frame
          ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
          // Dark tint for contrast
          ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
          // 1. Conveyor Belt Background
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Conveyor frame
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 50, canvas.width, 200);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 4;
          ctx.strokeRect(0, 50, canvas.width, 200);

          // Moving belt texture lines
          const step = (isAutoSimRunning ? 1.5 : 0.6) * beltSpeedFactor * beltDirection;
          beltOffset = (beltOffset + step) % 40;
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 2;
          for (let x = -40 + beltOffset; x < canvas.width + 40; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 52);
            ctx.lineTo(x, 248);
            ctx.stroke();
          }

          // Direction text
          ctx.fillStyle = 'rgba(100, 116, 139, 0.22)';
          ctx.font = 'bold 20px monospace';
          ctx.fillText(beltDirection > 0 ? 'KONVEYÖR AKIŞ YÖNÜ ➔ ➔ ➔' : '⬅ ⬅ ⬅ KONVEYÖR AKIŞ YÖNÜ', 220, 155);
        }

        // 2. Draw ROI Polygon
        if (roiPoints.length > 1) {
          ctx.save();
          ctx.strokeStyle = '#06b6d4';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 3]);
          ctx.beginPath();
          ctx.moveTo(roiPoints[0][0], roiPoints[0][1]);
          for (let p = 1; p < roiPoints.length; p++) ctx.lineTo(roiPoints[p][0], roiPoints[p][1]);
          if (roiPoints.length > 2 && !roiDrawMode) ctx.closePath();
          ctx.stroke();
          ctx.fillStyle = 'rgba(6, 182, 212, 0.08)';
          ctx.fill();
          ctx.setLineDash([]);
          // Corner handles
          roiPoints.forEach((pt, idx) => {
            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.arc(pt[0], pt[1], 4, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        }

        // 3. Draw 4-Point Homography Perspective Corners
        if (warpPoints.length > 0) {
          ctx.save();
          ctx.strokeStyle = '#a855f7';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(warpPoints[0][0], warpPoints[0][1]);
          for (let w = 1; w < warpPoints.length; w++) ctx.lineTo(warpPoints[w][0], warpPoints[w][1]);
          if (warpPoints.length === 4) ctx.closePath();
          ctx.stroke();
          ctx.fillStyle = 'rgba(168, 85, 247, 0.12)';
          ctx.fill();
          warpPoints.forEach((pt, idx) => {
            ctx.fillStyle = '#a855f7';
            ctx.fillRect(pt[0] - 8, pt[1] - 8, 16, 16);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText(`${idx + 1}`, pt[0] - 3, pt[1] + 3);
          });
          ctx.restore();
        }

        // 4. Optical Gate Line (X = opticalGateX)
        const gateX = opticalGateX;
        ctx.save();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = isDraggingGate ? 5 : 3;
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(gateX, 35);
        ctx.lineTo(gateX, 265);
        ctx.stroke();
        ctx.restore();

        // Gate Badge Tag (Click/Drag Handle)
        ctx.fillStyle = '#059669';
        ctx.fillRect(gateX - 50, 22, 100, 22);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('↔️ SAYIM KAPISI', gateX, 37);

        // 5. Move and Render Bags
        const speed = (isAutoSimRunning ? 2.0 : 0.8) * beltSpeedFactor * beltDirection;
        for (let i = bagsOnBelt.length - 1; i >= 0; i--) {
          const bag = bagsOnBelt[i];
          bag.x += speed;

          if (beltDirection > 0 && !bag.hasPassed && bag.x + bag.width / 2 >= gateX) {
            bag.hasPassed = true;
            triggerGateCrossingVisual(bag.isDefect ? 'defect' : (bag.isMulti ? 'multi' : 'normal'));
            playBeep(bag.isDefect ? 'defect' : (bag.isMulti ? 'multi' : 'count'));
            api(`/sessions/${sessionId}/simulate_bag`, { method: 'POST', body: JSON.stringify({ direction: bag.isMulti ? 2 : 1 }) })
              .then(res => updateCounterUI(res.counted_total, res.area_estimate_total))
              .catch(() => {});
          } else if (beltDirection < 0 && !bag.hasPassed && bag.x + bag.width / 2 <= gateX) {
            bag.hasPassed = true;
            triggerGateCrossingVisual(bag.isDefect ? 'defect' : (bag.isMulti ? 'multi' : 'normal'));
            playBeep(bag.isDefect ? 'defect' : (bag.isMulti ? 'multi' : 'count'));
            api(`/sessions/${sessionId}/simulate_bag`, { method: 'POST', body: JSON.stringify({ direction: bag.isMulti ? 2 : 1 }) })
              .then(res => updateCounterUI(res.counted_total, res.area_estimate_total))
              .catch(() => {});
          }

          ctx.save();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
          ctx.beginPath();
          ctx.roundRect(bag.x + 4, bag.y + 4, bag.width, bag.height, 12);
          ctx.fill();

          // Bag Gradient
          const grad = ctx.createLinearGradient(bag.x, bag.y, bag.x + bag.width, bag.y + bag.height);
          if (bag.isDefect) {
            grad.addColorStop(0, '#f87171');
            grad.addColorStop(1, '#dc2626');
          } else if (bag.isMulti) {
            grad.addColorStop(0, '#fbbf24');
            grad.addColorStop(1, '#f59e0b');
          } else if (activeBagColor === 'poly_white') {
            grad.addColorStop(0, '#f8fafc');
            grad.addColorStop(1, '#e2e8f0');
          } else if (activeBagColor === 'mortar_gray') {
            grad.addColorStop(0, '#94a3b8');
            grad.addColorStop(1, '#64748b');
          } else {
            grad.addColorStop(0, '#fef08a');
            grad.addColorStop(1, '#fde047');
          }

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect(bag.x, bag.y, bag.width, bag.height, 10);
          ctx.fill();

          // Border & Badge
          if (bag.isDefect) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(bag.x - 4, bag.y - 22, bag.width + 8, 18);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`🚨 HASARLI / DEFECT ${bag.id}`, bag.x, bag.y - 9);
          } else if (bag.isMulti) {
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#d97706';
            ctx.fillRect(bag.x - 4, bag.y - 22, bag.width + 8, 18);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`📦 2x BİTİŞİK ÇUVAL`, bag.x, bag.y - 9);
          } else {
            ctx.strokeStyle = activeBagColor === 'poly_white' ? '#94a3b8' : activeBagColor === 'mortar_gray' ? '#475569' : '#eab308';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 2]);
            ctx.strokeRect(bag.x - 4, bag.y - 4, bag.width + 8, bag.height + 8);
            ctx.setLineDash([]);

            ctx.fillStyle = '#4f46e5';
            ctx.fillRect(bag.x - 4, bag.y - 20, bag.width + 8, 16);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`TRK-${bag.id} 99%`, bag.x - 1, bag.y - 8);
          }

          ctx.fillStyle = bag.isDefect ? '#ffffff' : (activeBagColor === 'poly_white' ? '#1e293b' : activeBagColor === 'mortar_gray' ? '#0f172a' : '#713f12');
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(bag.isDefect ? 'YIRTIK / PATLAK' : bag.label.slice(0, 16), bag.x + bag.width / 2, bag.y + bag.height / 2 - 6);
          ctx.font = '9px sans-serif';
          ctx.fillText('FABRIC #2026', bag.x + bag.width / 2, bag.y + bag.height / 2 + 10);
          ctx.restore();

          if (beltDirection > 0 && bag.x > canvas.width + 100) {
            bagsOnBelt.splice(i, 1);
          } else if (beltDirection < 0 && bag.x < -150) {
            bagsOnBelt.splice(i, 1);
          }
        }

        if (isAutoSimRunning) {
          if (beltDirection > 0) {
            const lastBag = bagsOnBelt[bagsOnBelt.length - 1];
            if (!lastBag || lastBag.x > 220) {
              bagsOnBelt.push({
                x: -100,
                y: 85,
                width: 85,
                height: 120,
                label: activeBagLabel,
                id: nextTrackId++,
                hasPassed: false,
                isDefect: false,
                isMulti: false
              });
            }
          } else {
            const firstBag = bagsOnBelt[0];
            if (!firstBag || firstBag.x < canvas.width - 220) {
              bagsOnBelt.unshift({
                x: canvas.width + 80,
                y: 85,
                width: 85,
                height: 120,
                label: activeBagLabel,
                id: nextTrackId++,
                hasPassed: false,
                isDefect: false,
                isMulti: false
              });
            }
          }
        }

        canvasAnimationId = requestAnimationFrame(animate);
      }

      animate();
    }

    function triggerGateCrossingVisual(type = 'normal') {
      const flash = document.getElementById('gate-flash-overlay');
      if (flash) {
        flash.className = `absolute inset-0 pointer-events-none transition-opacity duration-150 ${type === 'defect' ? 'bg-rose-500/30' : (type === 'multi' ? 'bg-amber-400/30' : 'bg-emerald-400/25')}`;
        flash.style.opacity = '0.7';
        setTimeout(() => { flash.style.opacity = '0'; }, 200);
      }
      const countEl = document.getElementById('live-count');
      if (countEl) {
        countEl.classList.add('count-pulse');
        setTimeout(() => countEl.classList.remove('count-pulse'), 350);
      }
    }

    function updateCounterUI(newCount, newArea) {
      const countEl = document.getElementById('live-count');
      const areaEl = document.getElementById('live-area');
      const pctEl = document.getElementById('live-pct');
      const barEl = document.getElementById('live-progress-bar');
      if (countEl && newCount !== undefined) countEl.textContent = newCount;
      if (areaEl && newArea !== undefined) areaEl.textContent = Number(newArea).toFixed(1);
      if (pctEl && newCount !== undefined) {
        const pct = Math.min(100, Math.round((newCount / 200) * 100));
        pctEl.textContent = pct;
        if (barEl) barEl.style.width = pct + '%';
      }
    }

    function triggerSimPass(sessId, direction = 1, type = 'normal') {
      initAudio();
      if (type === 'multi') {
        bagsOnBelt.push({
          x: beltDirection > 0 ? -120 : 780,
          y: 85,
          width: 175,
          height: 120,
          label: '2x Bitişik Çuval',
          id: nextTrackId++,
          hasPassed: false,
          isDefect: false,
          isMulti: true
        });
      } else if (type === 'defect') {
        bagsOnBelt.push({
          x: beltDirection > 0 ? -90 : 750,
          y: 90,
          width: 80,
          height: 110,
          label: 'Patlak Çuval',
          id: nextTrackId++,
          hasPassed: false,
          isDefect: true,
          isMulti: false
        });
      } else if (type === 'normal') {
        bagsOnBelt.push({
          x: beltDirection > 0 ? -90 : 750,
          y: 85,
          width: 85,
          height: 120,
          label: activeBagLabel,
          id: nextTrackId++,
          hasPassed: false,
          isDefect: false,
          isMulti: false
        });
      }

      api(`/sessions/${sessId}/simulate_bag`, { method: 'POST', body: JSON.stringify({ direction }) })
        .then(res => {
          updateCounterUI(res.counted_total, res.area_estimate_total);
          playBeep(type);
          triggerGateCrossingVisual(type);
          if (type === 'multi') toast('📦 2x Bitişik Çuval Ayrıştırıldı (+2)', 'warn');
          else if (type === 'defect') toast('🚨 Hasarlı / Patlak Çuval İkazı! (Defect Alert)', 'error');
          else if (type === 'rollback') toast('🔁 Çift Sayım Düzeltildi: -1', 'warn');
          else toast('⚡ +1 Çuval Geçirildi', 'success');
        })
        .catch(e => toast(e.detail || 'İşlem yapılamadı', 'error'));
    }

    function startSSE(lineId) {
      if (sseSource) sseSource.close();
      try {
        sseSource = new EventSource(`${API}/live/lines/${lineId}?token=${auth.token}`);
        sseSource.onmessage = (e) => {
          try {
            const d = JSON.parse(e.data);
            if (d.counted_total !== undefined) {
              updateCounterUI(d.counted_total, d.area_estimate);
            }
            const fpsEl = document.getElementById('live-fps');
            if (fpsEl) fpsEl.textContent = (d.fps !== undefined && d.fps !== null) ? `${Number(d.fps).toFixed(1)} FPS` : '— FPS';
          } catch {}
        };
      } catch {}
    }

    function exportSessionsCSV() {
      api('/sessions').then(sessions => {
        let csv = 'ID,External_Ref,Line_ID,Target,Counted_Total,Area_Estimate,Status\n';
        sessions.forEach(s => {
          csv += `${s.id},"${s.external_ref || ''}",${s.line_id},${s.target_count || ''},${s.counted_total || 0},${s.area_estimate_total || 0},${s.status}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `sevkiyat_raporu_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        toast('CSV raporu indirildi', 'success');
      });
    }

    // Renders the real, currently-active (stage === 'active') model version's
    // real eval_scores from GET /models -- no hardcoded mAP/FPS/latency card.
    function renderActiveModelCard(mv) {
      const card = document.getElementById('active-model-card');
      if (!card) return;

      if (!mv) {
        card.innerHTML = `
          <div class="text-center py-8">
            <div class="text-2xl mb-2">🧠</div>
            <div class="text-sm font-bold text-slate-300">Aktif Model Bulunmuyor</div>

          </div>
        `;
        return;
      }

      const scores = mv.eval_scores || {};
      const map50 = (typeof scores.mAP_50 === 'number') ? `%${(scores.mAP_50 * 100).toFixed(1)}` : '—';
      const fps = (typeof scores.fps === 'number') ? scores.fps.toFixed(1) : '—';
      const latency = (typeof scores.latency_ms === 'number') ? `${scores.latency_ms.toFixed(1)} ms` : '—';

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="font-bold text-sm text-slate-200">Model #${mv.id}</span>
            <span class="badge bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">CANLIDA</span>
          </div>
          <div class="text-[10px] text-slate-500 leading-relaxed mb-4 font-mono break-all">SHA: ${escapeHtml(mv.onnx_hash ? mv.onnx_hash.substring(0, 24) + '...' : '—')}</div>

          <div class="grid grid-cols-3 gap-2 text-center text-xs font-mono">
            <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">

              <div class="font-bold text-emerald-400 mt-0.5">${map50}</div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
              <div class="text-[10px] text-slate-500">Çıkarım FPS</div>
              <div class="font-bold text-indigo-400 mt-0.5">${fps}</div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
              <div class="text-[10px] text-slate-500">Gecikme</div>
              <div class="font-bold text-slate-200 mt-0.5">${latency}</div>
            </div>
          </div>
        </div>

        <div class="mt-4 pt-3 border-t border-slate-800 flex space-x-2">
          <button onclick="downloadModelOnnx(${mv.id})" class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 rounded-lg border border-slate-700 transition">
            📤 ONNX İndir
          </button>
        </div>
      `;
    }

    // Real download: streams GET /api/models/{id}/download (services/api/routes.py)
    // which FileResponse()s the model's actual onnx_path from disk.
    async function downloadModelOnnx(modelId) {
      try {
        const res = await fetch(`${API}/models/${modelId}/download`, { headers: headers(false) });
        if (!res.ok) {
          let msg = 'ONNX indirilemedi';
          try { const j = await res.json(); msg = j.detail || msg; } catch {}
          throw new Error(msg);
        }
        const blob = await res.blob();
        const cd = res.headers.get('Content-Disposition') || '';
        const match = /filename="?([^"]+)"?/.exec(cd);
        const filename = match ? match[1] : `model_${modelId}.onnx`;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        toast('ONNX modeli indiriliyor...', 'success');
      } catch (e) {
        toast(e.message || 'ONNX indirilemedi', 'error');
      }
    }

    async function startTrainingRun() {
      const epochs = parseInt(document.getElementById('train-epochs').value) || 50;
      const batch = parseInt(document.getElementById('train-batch').value) || 16;
      try {
        const res = await api('/training/runs', {
          method: 'POST',
          body: JSON.stringify({ epochs, batch_size: batch, model: 'rf_detr' })
        });
        toast(`Eğitim işi başlatıldı: Job #${res.job_id}`, 'success');
      } catch (e) {
        toast(e.detail || 'Eğitim başlatılamadı', 'error');
      }
    }

                                <span class="w-2 h-2 rounded-full ${cam.enabled ? 'bg-emerald-400' : 'bg-slate-600'} flex-shrink-0"></span>
                                <span class="font-bold text-slate-200 flex-shrink-0">KAM-${cam.id}</span>
                                <span class="badge ${cam.role === 'counting' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-slate-700/60 text-slate-300 border border-slate-600/50'} text-[10px] flex-shrink-0">${CAMERA_ROLE_LABELS[cam.role] || cam.role}</span>
                                <span class="text-slate-500 font-mono truncate">${escapeHtml(cam.source_driver)}: ${escapeHtml(cam.source_config.rtsp_url || cam.source_config.url || cam.source_config.path || (cam.source_config.device_index !== undefined ? '#' + cam.source_config.device_index : 'yapılandırılmadı'))}</span>

                          <option value="auxiliary" selected>Yardımcı / İzleme</option>
                        </select>

    function toggleAddCameraForm(lineId) {
      const el = document.getElementById(`add-cam-form-${lineId}`);
      if (el) el.classList.toggle('hidden');
    }

    async function ensureNodeForSite(siteId) {
      const nodes = await api(`/nodes?site_id=${siteId}`);
      if (nodes.length > 0) return nodes[0].id;
      const node = await api('/nodes', { method: 'POST', body: JSON.stringify({ site_id: siteId, hostname: `edge-${siteId}-01` }) });
      return node.id;
    }

    function buildCameraSourceConfig(driver, sourceValue) {
      if (driver === 'usb') return { device_index: parseInt(sourceValue.replace('#', ''), 10) || 0 };
      if (driver === 'file') return { path: sourceValue };
      return { rtsp_url: sourceValue };
    }

    async function createCameraForLine(lineId, siteId) {
      const role = document.getElementById(`add-cam-role-${lineId}`).value;
      const driver = document.getElementById(`add-cam-driver-${lineId}`).value;
      const sourceValue = document.getElementById(`add-cam-source-${lineId}`).value.trim();
      if (!sourceValue) {
        toast('Kamera kaynağını girin (RTSP adresi, #0 gibi bir cihaz numarası veya dosya yolu).', 'error');
        return;
      }
      try {
        const nodeId = await ensureNodeForSite(siteId);
        const cam = await api('/cameras', {
          method: 'POST',
          body: JSON.stringify({ line_id: lineId, node_id: nodeId, source_driver: driver, source_config: buildCameraSourceConfig(driver, sourceValue), role }),
        });
        await api(`/cameras/${cam.id}/source`, {
          method: 'POST',
          body: JSON.stringify({ source_config: buildCameraSourceConfig(driver, sourceValue), source_driver: driver }),
        });
        toast(`Kamera eklendi: KAM-${cam.id}`, 'success');
        renderScreen();
      } catch (e) {
        toast(e.detail || 'Kamera eklenemedi', 'error');
      }
    }

    async function testCameraFeed(camId) {
      const resultEl = document.getElementById(`cam-test-result-${camId}`);
      if (resultEl) resultEl.textContent = 'Test ediliyor…';
      try {
        const res = await api(`/cameras/${camId}/test`, { method: 'POST' });
        if (resultEl) {
          resultEl.textContent = res.connected ? '✓ Bağlı' : '✗ Bağlanamadı';
          resultEl.className = `text-[11px] font-bold ${res.connected ? 'text-emerald-400' : 'text-rose-400'}`;
        }
        toast(res.message, res.connected ? 'success' : 'error');
      } catch (e) {
        if (resultEl) resultEl.textContent = '✗ Hata';
        toast(e.detail || 'Test başarısız', 'error');
      }
    }

    async function triggerCalibration(lineId, type) {
      try {
        const res = await api(`/calibrations/${lineId}/${type}`, { method: 'POST', body: JSON.stringify({ line_id: lineId }) });
        toast(`${type === 'motion' ? 'Optik akış hareket' : 'Ölçek'} kalibrasyonu başlatıldı (Job #${res.job_id})`, 'success');
      } catch (e) {
        toast(e.detail || 'Kalibrasyon başlatılamadı', 'error');
      }
    }

    async function viewLineConfig(lineId) {
      const drawer = document.getElementById(`cfg-drawer-${lineId}`);
      if (!drawer) return;
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) {
        try {
          const cfg = await api(`/configs/${lineId}`);
          drawer.innerHTML = `<pre>${escapeHtml(JSON.stringify(cfg.payload, null, 2))}</pre>`;
        } catch {
          drawer.innerHTML = '<div class="text-slate-500">Mevcut konfigürasyon yüklenemedi.</div>';
        }
      }
    }

            <!-- ERP Outbox Queue -->
            ${outbox.length > 0 ? `

                  <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-800 text-slate-400 uppercase text-[10px]">
                      <tr>
                        <th class="p-2.5">Outbox ID</th>

                    <tbody class="divide-y divide-slate-800 font-mono">
                      ${outbox.map(o => `
                        <tr>
                          <td class="p-2.5 text-indigo-400">#${o.id}</td>

                          <td class="p-2.5"><span class="badge ${o.status === 'sent' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">${escapeHtml(o.status)}</span></td>
                          <td class="p-2.5">${o.attempts || 0}</td>

                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      } catch (e) {
        c.innerHTML = `<div class="bg-rose-500/10 border border-rose-500/30 rounded-2xl p-6 text-rose-300">Hata: ${escapeHtml(e.detail || 'Sistem bilgisi alınamadı')}</div>`;

    async function cancelJob(jobId) {

        await api(`/system/jobs/${jobId}/cancel`, { method: 'POST' });
        toast(`İş iptal edildi: #${jobId}`);

  </script>

  <!-- Dispatch & Reconciliation Manifest Modal (§5.7, §5.8) -->
